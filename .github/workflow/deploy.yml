name: Build and Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend:${{ github.sha }}" >> $GITHUB_ENV

      - name: log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: build backend image
        run: docker build -t "$IMAGE" ./backend

      - name: push image to GHCR
        run: docker push "$IMAGE"

      - name: deploy image update to Rahti
        run: |
          curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz oc
          sudo mv oc /usr/local/bin/
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}
          oc project cs-assignment4
          oc set image deployment/backend-deployment backend="$IMAGE"
